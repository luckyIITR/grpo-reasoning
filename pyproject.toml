[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-reasoning"
version = "0.1.0"
description = "GRPO from scratch on SmolLM for chain-of-thought logical reasoning"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "bitsandbytes>=0.43.0",       # for 8-bit optimizer / quant if needed
    "wandb>=0.17.0",
    "hydra-core>=1.3.2",          # config management
    "openai>=1.40.0",             # for synthetic data generation
    "pydantic>=2.8.0",
    "tqdm",
    "numpy<2.0",                  # some libs still on numpy 1.x
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, naming
ignore = ["E501"]  # line length handled separately

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"